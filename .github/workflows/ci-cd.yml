name: Acebook CI/CD

on:
  push:
    branches:
      - main
      - setup-ci-cd

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for MongoDB
        run: |
          for attempt in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/27017) > /dev/null 2>&1; then
              echo "MongoDB is ready"
              exit 0
            fi

            echo "Waiting for MongoDB..."
            sleep 2
          done

          echo "MongoDB did not become ready"
          exit 1

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: |
          npm run start:test > /tmp/acebook-test-server.log 2>&1 &
          SERVER_PID=$!

          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          if ! timeout 60 bash -c \
            'until curl --fail --silent http://127.0.0.1:3030/ > /dev/null; do sleep 2; done'
          then
            echo "The test server did not start"
            cat /tmp/acebook-test-server.log
            exit 1
          fi

          npm run test:integration

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::664047078509:role/anton-acebook-github-actions-role
          aws-region: eu-west-2
          allowed-account-ids: 664047078509
          role-session-name: acebook-${{ github.run_id }}

      - name: Package and deploy Acebook
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          REVISION_FILE="acebook-${GITHUB_SHA}.zip"
          S3_KEY="revisions/${REVISION_FILE}"

          git archive \
            --format=zip \
            --output="${REVISION_FILE}" \
            HEAD

          aws s3 cp \
            "${REVISION_FILE}" \
            "s3://anton-acebook-eu-west-2/${S3_KEY}"

          DEPLOYMENT_ID="$(
            aws deploy create-deployment \
              --application-name anton-acebook \
              --deployment-group-name anton-acebook-deployment-group \
              --deployment-config-name CodeDeployDefault.AllAtOnce \
              --description "GitHub Actions deployment ${GITHUB_SHA}" \
              --s3-location "bucket=anton-acebook-eu-west-2,key=${S3_KEY},bundleType=zip" \
              --query deploymentId \
              --output text
          )"

          echo "Created CodeDeploy deployment: ${DEPLOYMENT_ID}"

          aws deploy wait deployment-successful \
            --deployment-id "${DEPLOYMENT_ID}"

          aws deploy get-deployment \
            --deployment-id "${DEPLOYMENT_ID}" \
            --query "deploymentInfo.status" \
            --output text