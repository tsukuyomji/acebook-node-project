name: Acebook CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for MongoDB
        run: |
          for attempt in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/27017) > /dev/null 2>&1; then
              echo "MongoDB is ready"
              exit 0
            fi

            echo "Waiting for MongoDB..."
            sleep 2
          done

          echo "MongoDB did not become ready"
          exit 1

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: |
          npm run start:test > /tmp/acebook-test-server.log 2>&1 &
          SERVER_PID=$!

          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          if ! timeout 60 bash -c \
            'until curl --fail --silent http://127.0.0.1:3030/ > /dev/null; do sleep 2; done'
          then
            echo "The test server did not start"
            cat /tmp/acebook-test-server.log
            exit 1
          fi

          npm run test:integration